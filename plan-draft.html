<!doctype html><meta charset="utf-8"><title>Antrim plan</title>
<style>html,body{margin:0;background:#e9eadf;height:100%}svg{display:block;width:100vw;height:100vh}</style>
<svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,sans-serif">
<defs>
  <pattern id="grass" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#8fbf6a"/><circle cx="4" cy="5" r="1.2" fill="#7fae5c"/><circle cx="10" cy="11" r="1.2" fill="#7fae5c"/></pattern>
  <pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#b07a4e"/><circle cx="3" cy="4" r="1.1" fill="#9a6640"/><circle cx="9" cy="9" r="1.1" fill="#9a6640"/></pattern>
  <pattern id="concrete" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#cfc9bd"/><path d="M0 0H40M0 0V40" stroke="#bfb8aa" stroke-width="1.5"/></pattern>
  <pattern id="roofA" width="18" height="10" patternUnits="userSpaceOnUse"><rect width="18" height="10" fill="#555b63"/><path d="M0 10H18" stroke="#474c53" stroke-width="2"/></pattern>
  <pattern id="roofB" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#b0583a"/><path d="M6 0V12" stroke="#974a30" stroke-width="2"/></pattern>
  <pattern id="deck" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c9a06a"/><path d="M0 0V10" stroke="#b58c58" stroke-width="1.5"/></pattern>
  <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#2b3a22" flood-opacity=".35"/></filter>
  <filter id="shs" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#2b3a22" flood-opacity=".3"/></filter>
</defs>
<!-- street side (north-east), road along the top-right in the photo; whole lot rotated to match the satellite view -->
<rect width="1600" height="1200" fill="#dfe4d3"/>
<g transform="rotate(38 800 600)">
  <!-- road -->
  <rect x="-200" y="-40" width="2000" height="190" fill="#8f949a"/>
  <path d="M-200 55H1800" stroke="#f0eee6" stroke-width="4" stroke-dasharray="40 30"/>
  <rect x="-200" y="150" width="2000" height="30" fill="#cfc9bd"/>
  <!-- lot -->
  <rect x="190" y="180" width="1220" height="690" fill="url(#grass)" stroke="#2f4a2a" stroke-width="5"/>
  <!-- driveway + courtyard concrete -->
  <path d="M190 180H1410V330H1070V560H940V330H190Z" fill="url(#concrete)"/>
  <!-- back-yard big trees (G) -->
  <g opacity=".95">
    <circle cx="330" cy="700" r="130" fill="#3f7a3b"/><circle cx="470" cy="640" r="105" fill="#4b8a44"/><circle cx="420" cy="780" r="95" fill="#376d34"/><circle cx="250" cy="560" r="80" fill="#4b8a44"/>
    <circle cx="300" cy="690" r="40" fill="#5b9a52" opacity=".7"/><circle cx="480" cy="620" r="36" fill="#5b9a52" opacity=".7"/>
  </g>
  <!-- garage (A) -->
  <g filter="url(#sh)"><rect x="240" y="235" width="260" height="190" fill="url(#roofB)" stroke="#6e3521" stroke-width="3"/><path d="M240 330H500" stroke="#6e3521" stroke-width="3"/></g>
  <!-- small shed (B) -->
  <g filter="url(#shs)"><rect x="515" y="380" width="60" height="55" fill="#8fa6a8" stroke="#5a6f70" stroke-width="2"/></g>
  <!-- deck (C) with umbrella -->
  <g filter="url(#shs)"><rect x="560" y="440" width="150" height="150" fill="url(#deck)" stroke="#8a6a3c" stroke-width="3"/><circle cx="640" cy="520" r="34" fill="#f1ede3" stroke="#bfb6a5" stroke-width="2"/><path d="M640 486V554M606 520H674" stroke="#bfb6a5" stroke-width="2"/></g>
  <!-- house (D) -->
  <g filter="url(#sh)"><rect x="700" y="300" width="380" height="330" fill="url(#roofA)" stroke="#2c3036" stroke-width="4"/><path d="M700 300L890 465L1080 300M700 630L890 465L1080 630" stroke="#3a4047" stroke-width="5" fill="none"/><text x="890" y="478" text-anchor="middle" font-size="34" font-weight="700" fill="#e9eadf">45</text></g>
  <!-- car -->
  <g filter="url(#shs)"><rect x="1110" y="360" width="60" height="110" rx="14" fill="#d9572b"/><rect x="1118" y="380" width="44" height="30" rx="6" fill="#7a2f17"/></g>
  <!-- raised beds (E, F, H) -->
  <g filter="url(#shs)">
    <rect x="1190" y="400" width="190" height="120" rx="6" fill="url(#soil)" stroke="#5e4028" stroke-width="5"/>
    <rect x="1160" y="560" width="150" height="90" rx="6" fill="#6fa25a" stroke="#5e4028" stroke-width="5"/>
    <rect x="1100" y="690" width="110" height="80" rx="6" fill="url(#soil)" stroke="#5e4028" stroke-width="5"/>
  </g>
  <!-- paths between beds -->
  <path d="M1190 540H1380M1160 670H1310" stroke="#d8cdb3" stroke-width="10" stroke-linecap="round" opacity=".8"/>
  <!-- small shrubs near beds -->
  <circle cx="1240" cy="790" r="24" fill="#4b8a44"/><circle cx="1290" cy="770" r="18" fill="#5b9a52"/><circle cx="960" cy="770" r="40" fill="#4b8a44"/>
  <!-- lawn areas labels later; letters -->
  <g font-size="40" font-weight="800" fill="#fff" stroke="#1c261b" stroke-width="6" paint-order="stroke" text-anchor="middle">
    <text x="370" y="345">A</text><text x="545" y="420">B</text><text x="640" y="625">C</text><text x="890" y="585">D</text>
    <text x="1285" y="475">E</text><text x="1235" y="620">F</text><text x="1155" y="745">H</text>
    <text x="380" y="710">G</text><text x="820" y="790">I</text><text x="1290" y="275">J</text><text x="1300" y="820">K</text><text x="560" y="820">L</text>
  </g>
</g>
<!-- compass + title -->
<g transform="translate(1480 90)"><circle r="44" fill="#fff" opacity=".9"/><path d="M0 -34L12 10L0 2L-12 10Z" fill="#c4552b"/><text y="-44" text-anchor="middle" font-size="18" font-weight="700" fill="#1c261b">N</text></g>
<rect x="24" y="30" width="430" height="92" rx="14" fill="#fff" opacity=".85"/><text x="40" y="70" font-size="40" font-weight="800" fill="#1c261b">45 Antrim · plan</text>
<text x="40" y="104" font-size="20" fill="#5f6b5c">Not to scale. What is each letter?</text>
<text x="1540" y="1160" text-anchor="end" font-size="20" fill="#5f6b5c">Antrim Crescent ↗</text>
</svg>
